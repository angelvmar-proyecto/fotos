<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Lector de Tablas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
        }
        h1 { text-align: center; color: #2d3748; }
        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: #f7fafc;
            cursor: pointer;
            margin: 20px 0;
        }
        .upload-area:hover { background: #edf2f7; }
        #fileInput { display: none; }
        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #48bb78; color: white; }
        .btn-info { background: #4299e1; color: white; }
        .btn-danger { background: #fc8181; color: white; }
        #previewImage {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }
        .table-container {
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        #resultTable th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: left;
        }
        #resultTable td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        .status-info { background: #bee3f8; color: #2a4365; }
        .status-success { background: #c6f6d5; color: #22543d; }
        .status-error { background: #fed7d7; color: #742a2a; }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .toolbar button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-demo { background: #9f7aea; color: white; }
        .btn-row { background: #68d391; color: white; }
        .btn-col { background: #63b3ed; color: white; }
        .btn-clear { background: #fc8181; color: white; }
        .badge {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Lector de Tablas</h1>
        <p style="text-align:center; color:#718096;">Extrae tablas de imágenes</p>
        
        <div class="upload-area" id="dropZone">
            <span style="font-size:3rem;">🖼️</span>
            <h3>Toca para subir imagen</h3>
            <p style="color:#a0aec0;">JPG, PNG, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <img id="previewImage" alt="Vista previa">
        
        <div class="controls">
            <button id="processBtn" class="btn-primary" disabled>🔍 Procesar</button>
            <button id="downloadBtn" class="btn-success" disabled>📥 CSV</button>
            <button id="copyBtn" class="btn-info" disabled>📋 Copiar</button>
        </div>
        
        <div id="status" class="status status-info">
            💡 Sube una imagen o usa "Ejemplo"
        </div>
        
        <div class="toolbar">
            <button class="btn-demo" id="demoBtn">📊 Ejemplo</button>
            <button class="btn-row" id="addRowBtn">➕ Fila</button>
            <button class="btn-col" id="addColBtn">➕ Columna</button>
            <button class="btn-clear" id="clearBtn">🗑️ Limpiar</button>
            <span class="badge" id="cellCount">0 celdas</span>
        </div>
        
        <div class="table-container">
            <table id="resultTable">
                <thead><tr><th>Carga una imagen o usa "Ejemplo"</th></tr></thead>
                <tbody><tr><td>📝 La tabla aparecerá aquí</td></tr></tbody>
            </table>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
