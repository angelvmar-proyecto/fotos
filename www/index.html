<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detectores de Tablas</title>
<style>
body{font-family:sans-serif;background:#1a1a1a;color:#e0e0e0;padding:12px;margin:0}
.panel{background:#2a2a2a;border-radius:8px;padding:14px;margin-bottom:14px}
h2{text-align:center;color:#4CAF50}h3{color:#4CAF50;margin-top:0}
button{background:#4CAF50;color:#fff;border:none;padding:10px 16px;border-radius:6px;margin:4px;cursor:pointer}
button:disabled{background:#555}
.btn-secondary{background:#2196F3}.btn-danger{background:#f44336}
.btn-opt{background:#FF9800;padding:6px 10px;font-size:12px}
#canvasContainer{position:relative;width:100%;height:420px;background:#000;border:2px solid #444;overflow:hidden}
#mainCanvas{display:block;touch-action:none}
.canvas-controls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:10}
.canvas-controls button{padding:8px 12px;margin:0;background:rgba(76,175,80,.9)}
.algo-row{display:flex;align-items:center;justify-content:space-between;background:#333;border-radius:4px;padding:8px;margin:6px 0}
.algo-row label{display:flex;align-items:center;cursor:pointer;flex:1}
.algo-row input{width:18px;height:18px;margin-right:8px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}
.layer-toggle{display:inline-block;padding:8px 10px;margin:4px;background:#333;border-radius:4px;cursor:pointer}
.layer-toggle.inactive{opacity:.35}
#statusIndicator{display:none;padding:10px;background:#333;border-radius:6px;text-align:center;color:#4CAF50;font-weight:bold}
#diagnosisBox{display:none;background:#333;border-left:4px solid #FFD700;padding:12px;border-radius:4px;font-size:14px;line-height:1.6}
.log-container{max-height:300px;overflow-y:auto;background:#111;padding:10px;font-family:monospace;font-size:12px;border-radius:4px}
.opt{background:#333;padding:8px;border-radius:4px;margin:6px 0}
</style>
</head>
<body>
<h2>🔍 Detectores de Tablas</h2>

<div class="panel">
<button onclick="document.getElementById('imageInput').click()">📷 Seleccionar Imagen</button>
<input type="file" id="imageInput" accept="image/*" style="display:none">
<span id="imgInfo" style="color:#999;margin-left:8px"></span>
</div>

<div class="panel">
<h3>🎨 Visualización</h3>
<div id="canvasContainer">
<canvas id="mainCanvas"></canvas>
<div class="canvas-controls">
<button onclick="canvasManager.zoomIn()">➕</button>
<button onclick="canvasManager.zoomOut()">➖</button>
<button onclick="canvasManager.reset()">🔄</button>
</div>
</div>
<div id="layerControls"></div>
</div>

<div class="panel">
<h3>⚙️ Algoritmos</h3>
<div class="opt">
<label><input type="checkbox" id="chkEvidence" checked> Validar evidencia anti-texto (descarta líneas sin soporte real)</label>
</div>
<div id="algoList"></div>
<button onclick="selectAll(true)">✅ Todos</button>
<button onclick="selectAll(false)">❌ Ninguno</button>
<button class="btn-opt" onclick="optimizeSelected()">🔧 Optimizar seleccionados</button>
<br><br>
<button onclick="runAlgorithms()" id="runButton" disabled>🚀 Ejecutar</button>
<button onclick="cancelRequested=true" id="cancelButton" class="btn-danger" style="display:none">⏹️ Cancelar</button>
<div id="statusIndicator"></div>
<div id="diagnosisBox"></div>
</div>

<div class="panel">
<h3>📝 Log</h3>
<button class="btn-secondary" onclick="copyLog()">📋 Copiar</button>
<button class="btn-secondary" onclick="clearLog()">🗑️ Limpiar</button>
<div class="log-container" id="logContainer"></div>
</div>

<script src="js/utils/logger.js"></script>
<script src="js/utils/image-processor.js"></script>
<script src="js/utils/preprocessor.js"></script>
<script src="js/utils/line-validator.js"></script>
<script src="js/utils/text-remover.js"></script>
<script src="js/visualization/canvas-manager.js"></script>
<script src="js/algorithms/hough.js"></script>
<script src="js/algorithms/profile-projection.js"></script>
<script src="js/algorithms/morphological.js"></script>
<script src="js/algorithms/radar-matcher.js"></script>
<script src="js/algorithms/echo-radar.js"></script>
<script src="js/algorithms/lsd.js"></script>
<script src="js/algorithms/gabor.js"></script>
<script src="js/algorithms/frangi.js"></script>
<script src="js/algorithms/fourier.js"></script>
<script src="js/algorithms/fourier-avanzado.js"></script>
<script src="js/algorithms/cfar.js"></script>
<script src="js/runner.js"></script>
<script src="js/diagnosis/adaptive-diagnosis.js"></script>

<script>
let canvasManager, runner, selector, currentImageData = null;
let isRunning = false, cancelRequested = false;
let algorithmResults = [], algos = [];

const DEFAULT_ON = ['Profile Projection','Morphological','Echo Radar','Fourier Analysis','Fourier Avanzado','Frangi Filter'];

function initApp(){
  logger.info("Iniciando aplicacion...");
  try{
    canvasManager = new CanvasManager('mainCanvas');
    runner = new AlgorithmRunner();
    selector = new AdaptiveDiagnosis();

    algos = [
      new HoughTransform(), new ProfileProjection(), new Morphological(),
      new RadarMatcher(), new EchoRadar(), new LSD(), new GaborFilters(),
      new FrangiFilter(), new FourierAnalysis(), new FourierAvanzado(), new CFARDetector()
    ];
    algos.forEach(a => runner.registerAlgorithm(a));
    buildAlgoList();
    document.getElementById('imageInput').addEventListener('change', handleImageLoad);
    logger.info("Aplicacion lista. " + algos.length + " algoritmos registrados.");
  }catch(e){ alert("ERROR: "+e.message); logger.error(e.message); }
}

function buildAlgoList(){
  const c = document.getElementById('algoList');
  c.innerHTML = '';
  algos.forEach((a,i) => {
    const row = document.createElement('div');
    row.className = 'algo-row';
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = a.name; cb.id = 'algo_'+i;
    cb.checked = DEFAULT_ON.indexOf(a.name) !== -1;
    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = a.color;
    lab.appendChild(cb); lab.appendChild(dot);
    lab.appendChild(document.createTextNode(a.name));
    const btn = document.createElement('button');
    btn.className = 'btn-opt'; btn.textContent = '🔧';
    btn.onclick = () => optimizeOne(a);
    row.appendChild(lab); row.appendChild(btn);
    c.appendChild(row);
  });
}

function selectAll(v){
  document.querySelectorAll('#algoList input').forEach(cb => cb.checked = v);
  logger.info(v ? "Todos los algoritmos seleccionados" : "Todos los algoritmos deseleccionados");
}

function handleImageLoad(ev){
  const f = ev.target.files[0]; if(!f) return;
  logger.info("Cargando: " + f.name);
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const cx = cv.getContext('2d'); cx.drawImage(img,0,0);
      currentImageData = cx.getImageData(0,0,cv.width,cv.height);
      lineValidator.invalidate();
      if (typeof preprocessor !== 'undefined' && preprocessor.clearCache) preprocessor.clearCache();
      selector.history = []; algorithmResults = [];
      canvasManager.clearLayers();
      document.getElementById('layerControls').innerHTML = '';
      document.getElementById('diagnosisBox').style.display = 'none';
      canvasManager.loadImage(currentImageData);
      document.getElementById('runButton').disabled = false;
      document.getElementById('imgInfo').textContent = img.width+'x'+img.height;
      logger.info("Imagen cargada: " + img.width + "x" + img.height);
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}

function drawResult(res){
  canvasManager.addLayer(res.algorithm, ctx => {
    ctx.strokeStyle = res.color; ctx.lineWidth = 2;
    res.lines.forEach(l => { ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.stroke(); });
  });
}

async function runAlgorithms(){
  if(!currentImageData || isRunning) return;
  const sel = Array.from(document.querySelectorAll('#algoList input:checked')).map(cb => cb.value);
  if(sel.length === 0){ logger.error("No hay algoritmos seleccionados"); return; }

  isRunning = true; cancelRequested = false; algorithmResults = [];
  canvasManager.clearLayers();
  document.getElementById('layerControls').innerHTML = '';
  document.getElementById('diagnosisBox').style.display = 'none';
  document.getElementById('runButton').disabled = true;
  document.getElementById('cancelButton').style.display = 'inline-block';

  const useEvidence = document.getElementById('chkEvidence').checked;
  logger.info("Algoritmos a ejecutar: " + sel.join(", "));
  logger.info("Validacion de evidencia: " + (useEvidence ? "ACTIVA" : "inactiva"));
  if(useEvidence) lineValidator.prepare(currentImageData);

  for(let i=0;i<sel.length;i++){
    if(cancelRequested){ logger.info("Ejecucion cancelada"); break; }
    const name = sel[i];
    showStatus(name + " (" + (i+1) + "/" + sel.length + ")");
    await new Promise(r => setTimeout(r,30));
    try{
      let res = await runner.runAlgorithm(name, currentImageData);
      if(useEvidence && !res.metrics.validated){
        logger.info("  Validando " + name + "...");
        res = lineValidator.filterResult(res);
        canvasManager.removeLayer(name);
      }
      algorithmResults.push(res);
      drawResult(res);
      logger.info(name + ": " + res.metrics.totalLines + " lineas en " + res.metrics.executionTime + "ms");
    }catch(e){ logger.error("Error en " + name + ": " + e.message); }
    await new Promise(r => setTimeout(r,0));
  }

  hideStatus();
  if(algorithmResults.length && !cancelRequested){
    try{ showDiagnosis(selector.analyze(algorithmResults, currentImageData)); }
    catch(e){ logger.error("Error en diagnostico: " + e.message); }
    updateLayerControls();
  }
  isRunning = false;
  document.getElementById('runButton').disabled = false;
  document.getElementById('cancelButton').style.display = 'none';
}

function paramsOf(a){
  const r = algorithmResults.find(x => x.algorithm === a.name);
  return r ? r : null;
}

function optimizeOne(a){
  const r = paramsOf(a);
  if(!r){ alert("Ejecuta primero " + a.name); return; }
  const n = r.metrics.totalLines;
  const cov = r.metrics.avgCoverage, run = r.metrics.avgRunRatio;
  let msg = [];

  if(a.name === 'Echo Radar' || a.name === 'Fourier Avanzado'){
    if(n < 15){
      lineValidator.minCoverage = Math.max(0.25, lineValidator.minCoverage - 0.10);
      lineValidator.minRunRatio = Math.max(0.25, lineValidator.minRunRatio - 0.10);
      lineValidator.minSegRatio = Math.max(0.30, lineValidator.minSegRatio - 0.10);
      lineValidator.gapTolerance = Math.min(14, lineValidator.gapTolerance + 3);
      msg.push('pocas lineas -> evidencia relajada');
    } else if(n > 200){
      lineValidator.minCoverage = Math.min(0.80, lineValidator.minCoverage + 0.08);
      lineValidator.minRunRatio = Math.min(0.85, lineValidator.minRunRatio + 0.08);
      lineValidator.gapTolerance = Math.max(2, lineValidator.gapTolerance - 1);
      msg.push('muchas lineas -> evidencia exigida');
    }
    if(a.name === 'Fourier Avanzado'){
      if(n > 200){ a.minValleyWidth++; msg.push('anchoValle=' + a.minValleyWidth); }
      else if(n < 15){ a.minValleyWidth = Math.max(2, a.minValleyWidth-1); a.thresholdPct = Math.min(0.6, a.thresholdPct+0.08);
        msg.push('anchoValle=' + a.minValleyWidth + ' umbral=' + a.thresholdPct.toFixed(2)); }
    }
  } else if(a.name === 'Fourier Analysis'){
    if(n > 150 && a.setMinDistance) a.setMinDistance((a.minDistance||15)+5);
    else if(n < 30 && a.setMinDistance) a.setMinDistance(Math.max(6,(a.minDistance||15)-4));
    msg.push('minDistance=' + a.minDistance);
  } else if(a.name === 'CFAR Detector'){
    if(n < 10){ a.thresholdFactor = Math.max(1.05,(a.thresholdFactor||1.6)-0.2); msg.push('factor=' + a.thresholdFactor.toFixed(2)); }
    else if(n > 150){ a.thresholdFactor = (a.thresholdFactor||1.6)+0.2; msg.push('factor=' + a.thresholdFactor.toFixed(2)); }
  } else if(a.name === 'Morphological'){
    if(n < 15){ a.kernelSize = Math.max(5,(a.kernelSize||15)-4); msg.push('kernel=' + a.kernelSize); }
    else if(n > 200){ a.kernelSize = (a.kernelSize||15)+4; msg.push('kernel=' + a.kernelSize); }
  }

  if(cov !== undefined) msg.push('cobertura=' + cov.toFixed(2) + ' run=' + run.toFixed(2));
  if(msg.length === 0) msg.push('sin cambio (resultado en rango)');
  logger.info('Optimizar ' + a.name + ': ' + msg.join(' | '));
  alert(a.name + '\n' + msg.join('\n') + '\n\nEjecuta de nuevo.');
}

function optimizeSelected(){
  const sel = Array.from(document.querySelectorAll('#algoList input:checked')).map(cb => cb.value);
  let n = 0;
  algos.forEach(a => { if(sel.indexOf(a.name) !== -1 && paramsOf(a)){ optimizeOneSilent(a); n++; } });
  logger.info('Optimizacion multiple: ' + n + ' algoritmos ajustados');
  alert(n + ' algoritmos ajustados. Ejecuta de nuevo.');
}

function optimizeOneSilent(a){
  const r = paramsOf(a); const n = r.metrics.totalLines;
  if(a.name === 'Echo Radar' || a.name === 'Fourier Avanzado'){
    if(n < 15){
      lineValidator.minCoverage = Math.max(0.25, lineValidator.minCoverage-0.10);
      lineValidator.minRunRatio = Math.max(0.25, lineValidator.minRunRatio-0.10);
      lineValidator.gapTolerance = Math.min(14, lineValidator.gapTolerance+3);
    } else if(n > 200){
      lineValidator.minCoverage = Math.min(0.80, lineValidator.minCoverage+0.08);
      lineValidator.minRunRatio = Math.min(0.85, lineValidator.minRunRatio+0.08);
      lineValidator.gapTolerance = Math.max(2, lineValidator.gapTolerance-1);
    }
  }
  if(a.name === 'Fourier Avanzado'){
    if(n > 200) a.minValleyWidth++;
    else if(n < 15){ a.minValleyWidth = Math.max(2,a.minValleyWidth-1); a.thresholdPct = Math.min(0.6,a.thresholdPct+0.08); }
  }
  if(a.name === 'Fourier Analysis' && a.setMinDistance){
    if(n > 150) a.setMinDistance((a.minDistance||15)+5);
    else if(n < 30) a.setMinDistance(Math.max(6,(a.minDistance||15)-4));
  }
  if(a.name === 'CFAR Detector'){
    if(n < 10) a.thresholdFactor = Math.max(1.05,(a.thresholdFactor||1.6)-0.2);
    else if(n > 150) a.thresholdFactor = (a.thresholdFactor||1.6)+0.2;
  }
  if(a.name === 'Morphological'){
    if(n < 15) a.kernelSize = Math.max(5,(a.kernelSize||15)-4);
    else if(n > 200) a.kernelSize = (a.kernelSize||15)+4;
  }
  logger.info('  ' + a.name + ' ajustado (' + n + ' lineas)');
}

function showDiagnosis(d){
  const b = document.getElementById('diagnosisBox');
  let h = '<strong style="color:#FFD700">🏆 ' + d.best + '</strong><br>';
  h += d.reasons.map(r => '• ' + r).join('<br>');
  if(d.ranking && d.ranking.length > 1){
    h += '<br><br><strong>Ranking:</strong><br>' + d.ranking.map((r,i) =>
      (i+1)+'. '+r.algorithm+' — '+r.score.toFixed(3)+' ('+r.metrics.totalLines+' lineas)').join('<br>');
  }
  b.innerHTML = h; b.style.display = 'block';
  logger.info("Mejor algoritmo: " + d.best);
  d.reasons.forEach(r => logger.info("  " + r));
}

function updateLayerControls(){
  const c = document.getElementById('layerControls');
  c.innerHTML = '<strong>Capas (toca = ocultar/mostrar, 💾 = exportar PNG):</strong><br>';
  algorithmResults.forEach(res => {
    const t = document.createElement('div');
    t.className = 'layer-toggle';
    t.innerHTML = '<span class="dot" style="background:'+res.color+'"></span>'+res.algorithm+': '+res.metrics.totalLines;
    const ex = document.createElement('button');
    ex.textContent = '💾';
    ex.style.cssText = 'margin-left:8px;padding:4px 8px;font-size:12px;background:#2196F3';
    ex.onclick = e => { e.stopPropagation(); canvasManager.exportLayer(res.algorithm); };
    t.appendChild(ex);
    t.onclick = () => { canvasManager.toggleLayer(res.algorithm); t.classList.toggle('inactive'); };
    c.appendChild(t);
  });
}

function showStatus(t){ const e=document.getElementById('statusIndicator'); e.textContent=t; e.style.display='block'; }
function hideStatus(){ document.getElementById('statusIndicator').style.display='none'; }
function copyLog(){ navigator.clipboard.writeText(logger.getLogsText()).then(()=>alert("Log copiado")).catch(e=>logger.error("Error al copiar: "+e)); }
function clearLog(){ logger.logs=[]; logger.startTime=Date.now(); updateLog(); }
function updateLog(){
  const c=document.getElementById('logContainer');
  c.innerHTML = logger.getLogs().map(l => '['+l.timestamp+'ms] ['+l.level+'] '+l.message).join('<br>');
  c.scrollTop = c.scrollHeight;
}
setInterval(updateLog, 500);
window.addEventListener("load", initApp);
</script>
</body>
</html>
