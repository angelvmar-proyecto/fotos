<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📊 Lector de Tablas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        h1 { text-align: center; color: #1a202c; font-size: 1.6rem; font-weight: 700; margin-bottom: 2px; }
        .subtitle { text-align: center; color: #4a5568; font-size: 0.85rem; margin-bottom: 16px; }
        
        #statusLoading {
            background: #fef3c7;
            padding: 10px 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #92400e;
            display: none;
            margin-bottom: 12px;
            border-left: 4px solid #f59e0b;
        }
        .upload-area {
            border: 3px dashed #25D366;
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            background: #f0fdf4;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-bottom: 14px;
        }
        .upload-area:active { transform: scale(0.97); background: #dcfce7; }
        .upload-area .icon { font-size: 2.8rem; display: block; margin-bottom: 4px; }
        .upload-area h3 { color: #1a202c; font-size: 1rem; font-weight: 600; }
        .upload-area p { color: #718096; font-size: 0.8rem; margin-top: 2px; }
        #fileInput { display: none; }
        
        #previewImage {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            margin: 8px 0 12px 0;
            display: none;
            border: 2px solid #25D366;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .modos-container {
            display: flex;
            gap: 8px;
            margin: 10px 0 8px 0;
            flex-wrap: wrap;
        }
        .modos-container button {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            background: #f7fafc;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
            min-width: 60px;
        }
        .modos-container button.active {
            border-color: #25D366;
            background: #25D366;
            color: white;
        }
        .modos-container button:active { transform: scale(0.95); }
        
        #modoActualLabel {
            text-align: center;
            font-size: 0.8rem;
            color: #4a5568;
            margin: 4px 0 10px 0;
            font-weight: 500;
            background: #f7fafc;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            width: auto;
        }
        .label-container { text-align: center; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin: 10px 0 14px 0;
            flex-wrap: wrap;
        }
        .controls button {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            min-width: 70px;
            color: white;
        }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .controls button:active:not(:disabled) { transform: scale(0.96); }
        .btn-primary { background: #25D366; }
        .btn-success { background: #128C7E; }
        .btn-info { background: #075E54; }
        
        .progress-bar {
            height: 20px;
            background: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin: 8px 0 12px 0;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #25D366, #128C7E);
            border-radius: 12px;
            transition: width 0.3s ease;
        }
        .status {
            padding: 10px 14px;
            border-radius: 10px;
            margin: 6px 0 12px 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-info { background: #dbeafe; color: #1e3a8a; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-warning { background: #fef3c7; color: #92400e; }
        
        .ocr-result {
            background: #0d1117;
            color: #00ff41;
            padding: 10px 12px;
            border-radius: 10px;
            margin: 8px 0 12px 0;
            max-height: 130px;
            overflow-y: auto;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            border: 1px solid #00ff41;
        }
        
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 10px 0;
            align-items: center;
        }
        .toolbar button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }
        .toolbar button:active { transform: scale(0.95); }
        .btn-row { background: #34D399; }
        .btn-col { background: #60A5FA; }
        .btn-clear { background: #F87171; }
        .badge {
            background: #075E54;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: auto;
        }
        
        .table-container {
            overflow-x: auto;
            margin: 10px 0 0 0;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        #resultTable thead { position: sticky; top: 0; z-index: 10; }
        #resultTable th {
            background: #075E54;
            color: white;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
        }
        #resultTable td {
            padding: 6px 10px;
            border-bottom: 1px solid #e5e7eb;
            min-height: 32px;
            word-break: break-word;
            font-size: 0.75rem;
        }
        #resultTable tr:nth-child(even) { background: #f8fafc; }
        #resultTable tr:hover { background: #e6f7e6; }
        
        @media (max-width: 480px) {
            .container { padding: 14px 10px; }
            h1 { font-size: 1.2rem; }
            .modos-container button { font-size: 0.65rem; padding: 8px 4px; }
            .controls button { font-size: 0.7rem; padding: 10px 4px; }
            .upload-area { padding: 18px 10px; }
            .upload-area .icon { font-size: 2rem; }
            .toolbar button { font-size: 0.65rem; padding: 5px 10px; }
            .badge { font-size: 0.6rem; padding: 2px 8px; }
            #resultTable { font-size: 0.65rem; }
            #resultTable th, #resultTable td { padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <h1>📊 Lector de Tablas</h1>
        <p class="subtitle">3 modos de extracción para diferentes formatos</p>

        <div id="statusLoading">⏳ Cargando OCR...</div>

        <div class="upload-area" id="dropZone">
            <span class="icon">📸</span>
            <h3>Toca para subir captura</h3>
            <p>JPG, PNG, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <img id="previewImage" alt="Vista previa de la imagen">

        <div class="modos-container">
            <button id="modoLineasBtn" class="active">🔍 Líneas</button>
            <button id="modoEspaciosBtn">📊 Espacios</button>
            <button id="modoPatronBtn">📋 Patrón</button>
        </div>
        <div class="label-container">
            <span id="modoActualLabel">Modo: 🔍 Líneas (detección por bordes)</span>
        </div>

        <div class="controls">
            <button id="processBtn" class="btn-primary" disabled>🔍 Extraer</button>
            <button id="downloadBtn" class="btn-success" disabled>📥 CSV</button>
            <button id="copyBtn" class="btn-info" disabled>📋 Copiar</button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="status" class="status status-info">📸 Sube una captura de pantalla</div>

        <div class="ocr-result" id="ocrResult"></div>

        <div class="toolbar">
            <button class="btn-row" id="addRowBtn">➕ Fila</button>
            <button class="btn-col" id="addColBtn">➕ Columna</button>
            <button class="btn-clear" id="clearBtn">🗑️ Limpiar</button>
            <span class="badge" id="cellCount">0 celdas</span>
        </div>

        <div class="table-container">
            <table id="resultTable">
                <thead>
                    <tr><th>📝 Toca dos veces para editar</th></tr>
                </thead>
                <tbody>
                    <tr><td>Sube una captura y selecciona un modo</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
