<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creador de Iconos</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="status" id="status">¡Listo!</div>
<header>
  📲 Creador de Iconos
  <div class="subtitle">3 pasos y listo</div>
</header>

<div class="container">

  <!-- PASO 1: VISTA PREVIA -->
  <div class="preview-card">
    <canvas id="mainCanvas" width="192" height="192"></canvas>
    <div class="preview-sizes" id="previewSizes"></div>
  </div>

  <!-- PASO 2: FOTO -->
  <div class="card">
    <div class="step-title">1. Pon tu imagen</div>
    <label class="big-btn" for="fotoInput">
      📷 Elegir foto o dibujo
      <input type="file" id="fotoInput" accept="image/*" onchange="subirFoto(this)" hidden>
    </label>
    <div class="row" id="fotoAcciones" style="display:none">
      <button class="btn btn-sm btn-outline" onclick="abrirRecorte()">✂️ Recortar</button>
      <button class="btn btn-sm btn-outline" onclick="quitarFoto()">✖️ Quitar foto</button>
    </div>
    <div class="row" id="recorteRow" style="display:none">
      <input type="range" id="recorteTam" min="20" max="100" value="80">
      <button class="btn btn-sm btn-primary" onclick="aplicarRecorte()">✅ Aplicar recorte</button>
    </div>
    <p class="hint">Sin foto, creas un icono con color y texto.</p>
  </div>

  <!-- PASO 3: COLOR -->
  <div class="card">
    <div class="step-title">2. Elige un color</div>
    <div class="colors" id="colores"></div>
  </div>

  <!-- PASO 4: TEXTO -->
  <div class="card">
    <div class="step-title">3. Ponle texto (opcional)</div>
    <div class="row">
      <input type="text" id="iconText" maxlength="3" placeholder="ABC">
    </div>
    <div class="row">
      <label>Posición:</label>
      <select id="textPos">
        <option value="center">Centro</option>
        <option value="bottom">Abajo</option>
        <option value="top">Arriba</option>
      </select>
    </div>
  </div>

  <!-- BOTÓN PRINCIPAL -->
  <button class="download-btn" onclick="descargarTodos()">⬇️ DESCARGAR MIS ICONOS</button>

  <!-- MOCKUP -->
  <div class="mockup-wrap">
    <div class="mockup-phone">
      <div class="mockup-icon">
        <canvas id="mockupCanvas" width="60" height="60"></canvas>
        <span id="mockupName">Mi_App</span>
      </div>
      <div class="mockup-dock">
        <div class="dock-dot"></div>
        <div class="dock-dot"></div>
        <div class="dock-dot"></div>
        <div class="dock-dot"></div>
      </div>
    </div>
  </div>

  <!-- AVANZADO -->
  <details class="advanced">
    <summary>⚙️ Más opciones</summary>

    <div class="adv-section">
      <label class="adv-label">Nombre de la app</label>
      <input type="text" id="projName" placeholder="Mi_App" value="Mi_App" oninput="document.getElementById('mockupName').textContent = this.value || 'Mi_App'">
    </div>

    <div class="adv-section">
      <label class="adv-label">Tamaño del texto</label>
      <input type="range" id="fontSize" min="12" max="80" value="48">
    </div>

    <div class="adv-section" id="arteLinealBox" style="display:none">
      <label class="adv-label">Convertir foto a dibujo</label>
      <div class="row">
        <button class="btn btn-sm btn-outline" onclick="convertirArteLineal()">✏️ Convertir</button>
        <button class="btn btn-sm btn-outline" onclick="volverFotoOriginal()">↩️ Volver</button>
      </div>
      <div class="row">
        <label>Detalle:</label>
        <input type="range" id="linealNivel" min="10" max="100" value="50">
      </div>
    </div>

    <div class="adv-section">
      <button class="btn btn-sm btn-err" onclick="resetTodo()">🗑️ Reiniciar todo</button>
    </div>
  </details>

</div>

<script src="js/app.js"></script>
</body>
</html>
