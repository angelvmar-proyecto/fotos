<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detectores de Tablas</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 15px; margin: 0; }
        .panel { background: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 6px; margin: 5px; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary { background: #2196F3; }
        .btn-danger { background: #f44336; }
        #canvasContainer { position: relative; width: 100%; height: 400px; background: #000; border: 2px solid #444; margin-bottom: 15px; overflow: hidden; }
        #mainCanvas { display: block; touch-action: none; }
        .canvas-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .canvas-controls button { padding: 8px 12px; font-size: 16px; background: rgba(76, 175, 80, 0.9); margin: 0; }
        .log-container { max-height: 300px; overflow-y: auto; background: #111; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; }
        .checkbox-item { margin: 10px 0; padding: 8px; background: #333; border-radius: 4px; }
        .checkbox-item input { margin-right: 10px; width: 18px; height: 18px; }
        .checkbox-item label { cursor: pointer; }
        .color-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
        #statusIndicator { display: none; padding: 12px; background: #333; border-radius: 6px; margin: 10px 0; text-align: center; font-weight: bold; color: #4CAF50; }
        .layer-toggle { display: inline-block; padding: 8px 12px; margin: 5px; background: #333; border-radius: 4px; cursor: pointer; }
        .layer-toggle.inactive { opacity: 0.4; }
        h2 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        h3 { color: #4CAF50; margin-top: 0; }
    </style>
</head>
<body>
    <h2>🔍 Detectores de Tablas</h2>
    
    <div class="panel">
        <button onclick="document.getElementById('imageInput').click()">📷 Seleccionar Imagen</button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
    </div>

    <div class="panel" id="vizPanel">
        <h3>🎨 Visualización</h3>
        <div id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <div class="canvas-controls">
                <button onclick="canvasManager.zoomIn()">➕</button>
                <button onclick="canvasManager.zoomOut()">➖</button>
                <button onclick="canvasManager.reset()">🔄</button>
            </div>
        </div>
        <div id="layerControls"></div>
    </div>

    <div class="panel">
        <h3>⚙️ Algoritmos</h3>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_hough" value="Hough Transform" checked>
            <span class="color-dot" style="background: #FF0000;"></span>
            <label for="algo_hough">Hough Transform</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_profile" value="Profile Projection" checked>
            <span class="color-dot" style="background: #FFFF00;"></span>
            <label for="algo_profile">Profile Projection</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_morph" value="Morphological" checked>
            <span class="color-dot" style="background: #808080;"></span>
            <label for="algo_morph">Morphological</label>
        </div>
        <br>
        <button onclick="selectAll()">✅ Seleccionar Todos</button>
        <button onclick="deselectAll()">❌ Deseleccionar Todos</button>
        <br><br>
        <button onclick="runAlgorithms()" id="runButton" disabled>🚀 Ejecutar</button>
        <button onclick="cancelExecution()" id="cancelButton" class="btn-danger" style="display:none;">⏹️ Cancelar</button>
        <div id="statusIndicator"></div>
    </div>

    <div class="panel">
        <h3>📝 Log</h3>
        <button class="btn-secondary" onclick="copyLog()">📋 Copiar Log</button>
        <button class="btn-secondary" onclick="clearLog()">🗑️ Limpiar Log</button>
        <div class="log-container" id="logContainer"></div>
    </div>

    <script src="js/utils/logger.js"></script>
    <script src="js/utils/image-processor.js"></script>
    <script src="js/utils/preprocessor.js"></script>
    <script src="js/visualization/canvas-manager.js"></script>
    <script src="js/algorithms/hough.js"></script>
    <script src="js/algorithms/profile-projection.js"></script>
    <script src="js/algorithms/morphological.js"></script>
    <script src="js/runner.js"></script>
    <script src="js/diagnosis/intelligent-selector.js"></script>
    
    <script>
        let canvasManager, runner, selector, currentImageData = null;
        let isRunning = false;
        let cancelRequested = false;
        let algorithmResults = [];

        function initApp() {
            logger.info("Iniciando aplicacion...");
            try {
                canvasManager = new CanvasManager('mainCanvas');
                runner = new AlgorithmRunner();
                selector = new IntelligentSelector();
                
                runner.registerAlgorithm(new HoughTransform());
                runner.registerAlgorithm(new ProfileProjection());
                runner.registerAlgorithm(new Morphological());
                
                document.getElementById('imageInput').addEventListener('change', handleImageLoad);
                logger.info("Aplicacion lista. 3 algoritmos registrados.");
            } catch (e) {
                alert("ERROR: " + e.message);
                logger.error(e.message);
            }
        }

        function selectAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
            logger.info("Todos los algoritmos seleccionados");
        }

        function deselectAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            logger.info("Todos los algoritmos deseleccionados");
        }

        function handleImageLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            logger.info("Cargando: " + file.name);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // IMPORTANTE: Recalcular dimensiones del canvas despues de que el panel sea visible
                    setTimeout(() => {
                        canvasManager.loadImage(currentImageData);
                        document.getElementById('runButton').disabled = false;
                        logger.info("Imagen cargada: " + img.width + "x" + img.height);
                    }, 100);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function runAlgorithms() {
            if (!currentImageData || isRunning) return;
            
            const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            if (selected.length === 0) {
                logger.error("No hay algoritmos seleccionados");
                return;
            }
            
            isRunning = true;
            cancelRequested = false;
            algorithmResults = [];
            canvasManager.clearLayers();
            document.getElementById('runButton').disabled = true;
            document.getElementById('cancelButton').style.display = 'inline-block';
            
            logger.info("Ejecutando algoritmos seleccionados...");
            logger.info("Algoritmos a ejecutar: " + selected.join(", "));
            
            for (let i = 0; i < selected.length; i++) {
                if (cancelRequested) {
                    logger.info("Ejecucion cancelada por el usuario");
                    break;
                }
                
                const algoName = selected[i];
                showStatus(`Procesando ${algoName}... (${i+1}/${selected.length})`);
                
                try {
                    const result = await runner.runAlgorithm(algoName, currentImageData);
                    algorithmResults.push(result);
                    
                    canvasManager.addLayer(result.algorithm, (ctx) => {
                        ctx.strokeStyle = result.color;
                        ctx.lineWidth = 2;
                        result.lines.forEach(line => {
                            ctx.beginPath(); ctx.moveTo(line.x1, line.y1); ctx.lineTo(line.x2, line.y2); ctx.stroke();
                        });
                    });
                    
                    logger.info(`${result.algorithm}: ${result.metrics.totalLines} lineas en ${result.metrics.executionTime}ms`);
                } catch (e) {
                    logger.error(`Error en ${algoName}: ${e.message}`);
                }
                
                await new Promise(resolve => setTimeout(resolve, 0));
            }
            
            hideStatus();
            
            if (algorithmResults.length > 0 && !cancelRequested) {
                const diagnosis = selector.analyze(algorithmResults);
                logger.info("Mejor algoritmo: " + diagnosis.best);
                logger.info("Razones: " + diagnosis.reasons.join(" | "));
                
                updateLayerControls();
            }
            
            isRunning = false;
            document.getElementById('runButton').disabled = false;
            document.getElementById('cancelButton').style.display = 'none';
        }

        function updateLayerControls() {
            const container = document.getElementById('layerControls');
            container.innerHTML = '<h3>Capas (toca para mostrar/ocultar)</h3>';
            
            algorithmResults.forEach(result => {
                const toggle = document.createElement('div');
                toggle.className = 'layer-toggle';
                toggle.innerHTML = `
                    <span class="color-dot" style="background: ${result.color};"></span>
                    <span>${result.algorithm}: ${result.metrics.totalLines} lineas</span>
                `;
                toggle.onclick = () => {
                    canvasManager.toggleLayer(result.algorithm);
                    toggle.classList.toggle('inactive');
                };
                container.appendChild(toggle);
            });
        }

        function cancelExecution() {
            cancelRequested = true;
            logger.info("Cancelacion solicitada...");
        }

        function showStatus(text) {
            const indicator = document.getElementById('statusIndicator');
            indicator.textContent = text;
            indicator.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('statusIndicator').style.display = 'none';
        }

        function copyLog() {
            const text = logger.getLogsText();
            navigator.clipboard.writeText(text).then(() => {
                alert("Log copiado al portapapeles");
                logger.info("Log copiado al portapapeles");
            }).catch(err => {
                logger.error("Error al copiar: " + err);
            });
        }

        function clearLog() {
            logger.logs = [];
            logger.startTime = Date.now();
            updateLog();
            logger.info("Log limpiado");
        }

        function updateLog() {
            const container = document.getElementById('logContainer');
            container.innerHTML = logger.getLogs().map(l => `[${l.timestamp}ms] [${l.level}] ${l.message}`).join('<br>');
            container.scrollTop = container.scrollHeight;
        }
        setInterval(updateLog, 500);
        window.addEventListener("load", initApp);
    </script>
</body>
</html>
