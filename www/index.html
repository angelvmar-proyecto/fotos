<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Lector de Tablas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #25D366;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
        }
        h1 { text-align: center; color: #2d3748; }
        .upload-area {
            border: 3px dashed #25D366;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: #f0fdf4;
            cursor: pointer;
            margin: 20px 0;
        }
        #fileInput { display: none; }
        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: #25D366; color: white; }
        .btn-success { background: #128C7E; color: white; }
        .btn-info { background: #075E54; color: white; }
        #previewImage {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            display: none;
        }
        .table-container {
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        #resultTable th {
            background: #075E54;
            color: white;
            padding: 10px;
            text-align: left;
        }
        #resultTable td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        .status-info { background: #dbeafe; color: #1e40af; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .progress-bar {
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #25D366, #128C7E);
            width: 0%;
            transition: width 0.3s;
        }
        .ocr-result {
            background: #1a1a2e;
            color: #00ff41;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.7rem;
            display: none;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .toolbar button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-row { background: #34D399; color: white; }
        .btn-col { background: #60A5FA; color: white; }
        .btn-clear { background: #F87171; color: white; }
        .badge {
            background: #075E54;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Lector de Tablas</h1>
        <p style="text-align:center; color:#718096;">OCR REAL - Convierte capturas de Excel</p>
        
        <div id="statusLoading" style="background:#fef3c7; padding:10px; border-radius:8px; text-align:center; display:none;"></div>
        
        <div class="upload-area" id="dropZone">
            <span style="font-size:3rem;">📸</span>
            <h3>Toca para subir captura</h3>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <img id="previewImage" alt="Vista previa">
        
        <div class="controls">
            <button id="processBtn" class="btn-primary" disabled>🔍 Extraer</button>
            <button id="downloadBtn" class="btn-success" disabled>📥 CSV</button>
            <button id="copyBtn" class="btn-info" disabled>📋 Copiar</button>
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="status" class="status status-info">📸 Sube una captura de pantalla</div>
        <div class="ocr-result" id="ocrResult"></div>
        
        <div class="toolbar">
            <button class="btn-row" id="addRowBtn">➕ Fila</button>
            <button class="btn-col" id="addColBtn">➕ Columna</button>
            <button class="btn-clear" id="clearBtn">🗑️ Limpiar</button>
            <span class="badge" id="cellCount">0 celdas</span>
        </div>
        
        <div class="table-container">
            <table id="resultTable">
                <thead><tr><th>📝 Toca dos veces para editar</th></tr></thead>
                <tbody><tr><td>Sube una captura para extraer la tabla</td></tr></tbody>
            </table>
        </div>
    </div>
    
    <script src="libs/tesseract/tesseract.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
