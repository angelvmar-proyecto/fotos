<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creador de Iconos</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="status" id="status">¡Listo!</div>
<header>
  📲 Creador de Iconos
  <div class="subtitle">Foto o diseño → icono APK</div>
</header>

<div class="container">

  <!-- PREVIEW -->
  <div class="card preview-card">
    <canvas id="mainCanvas" width="192" height="192"></canvas>
    <div class="preview-sizes" id="previewSizes"></div>
  </div>

  <!-- FOTO -->
  <div class="card">
    <h2>📷 Foto</h2>
    <div class="row">
      <input type="file" id="fotoInput" accept="image/*" onchange="subirFoto(this)">
      <button class="btn btn-outline btn-sm" onclick="quitarFoto()">✖️ Quitar</button>
    </div>
    <div class="row" id="recorteRow" style="display:none">
      <label>Recorte:</label>
      <input type="range" id="recorteTam" min="20" max="100" value="80">
      <button class="btn btn-primary btn-sm" onclick="aplicarRecorte()">✅ Aplicar</button>
    </div>
    <p class="hint" id="fotoHint">Opcional. Sin foto, usas solo colores y texto.</p>
  </div>

  <!-- DISEÑO -->
  <div class="card">
    <h2>🎨 Diseño</h2>
    <div class="row">
      <label>Paletas:</label>
      <div class="palette-scroll" id="paletas"></div>
    </div>
    <div class="row">
      <label>Fondo:</label>
      <select id="bgType" onchange="toggleBgOptions()">
        <option value="solid">Sólido</option>
        <option value="gradient">Gradiente</option>
        <option value="none">Transparente</option>
      </select>
      <input type="color" id="bgColor1" value="#1976D2">
      <input type="color" id="bgColor2" value="#0D47A1">
    </div>
    <div class="row">
      <label>Forma:</label>
      <select id="shapeType">
        <option value="circle">Círculo</option>
        <option value="square">Cuadrado</option>
        <option value="rounded">Redondo</option>
        <option value="triangle">Triángulo</option>
        <option value="hexagon">Hexágono</option>
        <option value="none">Sin forma</option>
      </select>
      <input type="color" id="shapeColor" value="#FFFFFF">
      <input type="range" id="shapeSize" min="20" max="80" value="38" style="max-width:90px">
    </div>
  </div>

  <!-- TEXTO -->
  <div class="card">
    <h2>🔤 Texto</h2>
    <div class="row">
      <input type="text" id="iconText" maxlength="3" placeholder="ABC">
      <input type="color" id="textColor" value="#FFFFFF">
    </div>
    <div class="row">
      <label>Posición:</label>
      <select id="textPos">
        <option value="center">Centro</option>
        <option value="bottom">Abajo</option>
        <option value="top">Arriba</option>
      </select>
      <label>Tamaño:</label>
      <input type="range" id="fontSize" min="12" max="80" value="48" style="max-width:90px">
    </div>
    <div class="row">
      <label>Negrita:</label>
      <div class="toggle-switch on" id="fontBold" onclick="this.classList.toggle('on');draw()"></div>
      <label>Sombra texto:</label>
      <div class="toggle-switch" id="textShadow" onclick="this.classList.toggle('on');draw()"></div>
    </div>
  </div>

  <!-- EFECTOS -->
  <div class="card">
    <h2>✨ Efectos</h2>
    <div class="row">
      <label>Sombra general:</label>
      <div class="toggle-switch" id="shadowOn" onclick="this.classList.toggle('on');draw()"></div>
      <label>Borde:</label>
      <div class="toggle-switch" id="borderOn" onclick="this.classList.toggle('on');draw()"></div>
    </div>
    <div class="row">
      <button class="btn btn-outline" onclick="undo()">↩️ Deshacer</button>
      <button class="btn btn-outline" onclick="redo()">↪️ Rehacer</button>
      <button class="btn btn-err" onclick="resetTodo()">🗑️ Reiniciar</button>
    </div>
  </div>

  <!-- ARTE LINEAL -->
  <div class="card">
    <h2>✏️ Arte Lineal</h2>
    <p class="hint">Convierte la foto en dibujo de líneas. Requiere una foto cargada.</p>
    <div class="row">
      <button class="btn btn-primary" onclick="convertirArteLineal()">🔄 Convertir a líneas</button>
      <button class="btn btn-outline" onclick="volverFotoOriginal()">↩️ Volver a foto</button>
    </div>
    <div class="row">
      <label>Detalle:</label>
      <input type="range" id="linealNivel" min="10" max="100" value="50">
      <span id="linealNivelEtiqueta">50%</span>
    </div>
    <div class="row">
      <label>Umbral:</label>
      <input type="range" id="linealUmbral" min="10" max="240" value="128">
      <button class="btn btn-outline btn-sm" onclick="autoUmbral()">🪄 Auto</button>
    </div>
    <div class="row">
      <label>Color líneas:</label>
      <input type="color" id="linealColorLineas" value="#000000">
      <label>Fondo:</label>
      <input type="color" id="linealFondo" value="#FFFFFF">
    </div>
  </div>

  <!-- EXPORTAR -->
  <div class="card">
    <h2>📦 Exportar</h2>
    <div class="row">
      <button class="btn btn-primary" onclick="descargarTodos()">⬇️ Descargar ZIP completo</button>
      <button class="btn btn-outline" onclick="descargarIndividual()">🖼️ Solo esta vista</button>
    </div>
    <div class="row">
      <label>Tamaño vista:</label>
      <div class="size-pills" id="sizePills">
        <button data-size="mdpi">48</button>
        <button data-size="hdpi">72</button>
        <button data-size="xhdpi" class="active">96</button>
        <button data-size="xxhdpi">144</button>
        <button data-size="xxxhdpi">192</button>
        <button data-size="play">512</button>
      </div>
    </div>
    <div class="row">
      <input type="text" id="projName" placeholder="Nombre proyecto" value="Mi_App">
      <button class="btn btn-outline btn-sm" onclick="guardarProyecto()">💾 Guardar</button>
    </div>
    <div class="proj-list" id="projList"></div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
