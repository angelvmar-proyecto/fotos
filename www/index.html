<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detectores de Tablas</title>
<style>
body{font-family:sans-serif;background:#1a1a1a;color:#e0e0e0;padding:15px;margin:0;}
.panel{background:#2a2a2a;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.3);}
h2{text-align:center;color:#4CAF50;margin-bottom:20px;}
h3{color:#4CAF50;margin-top:0;}
button{background:#4CAF50;color:#fff;border:none;padding:12px 20px;border-radius:6px;margin:5px;font-size:14px;}
button:disabled{background:#555;}
.btn-secondary{background:#2196F3;}
.btn-danger{background:#f44336;}
.btn-optimize{background:#FF9800;padding:6px 12px;font-size:12px;margin-left:10px;}
#canvasContainer{position:relative;width:100%;height:420px;background:#000;border:2px solid #444;margin-bottom:15px;overflow:hidden;border-radius:4px;}
#mainCanvas{display:block;touch-action:none;}
.canvas-controls{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:10;}
.canvas-controls button{padding:8px 12px;font-size:16px;background:rgba(76,175,80,.9);margin:0;}
.log-container{max-height:320px;overflow-y:auto;background:#111;padding:10px;font-family:monospace;font-size:12px;border-radius:4px;border:1px solid #333;}
.checkbox-item{margin:8px 0;padding:10px;background:#333;border-radius:4px;display:flex;align-items:center;justify-content:space-between;}
.checkbox-item div{display:flex;align-items:center;gap:10px;flex:1;}
.checkbox-item input[type="checkbox"]{width:18px;height:18px;}
.checkbox-item label{flex:1;}
.color-dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;}
#statusIndicator{display:none;padding:12px;background:#333;border-radius:6px;margin:10px 0;text-align:center;font-weight:bold;color:#4CAF50;border-left:4px solid #4CAF50;}
.layer-toggle{display:inline-block;padding:8px 12px;margin:5px;background:#333;border-radius:4px;}
.layer-toggle.inactive{opacity:.35;}
#diagnosisBox{background:#333;border-left:4px solid #FFD700;padding:12px;border-radius:4px;margin-top:10px;font-size:14px;line-height:1.6;display:none;}
#analysisBox{background:#1e3a5f;border-left:4px solid #2196F3;padding:12px;border-radius:4px;margin-top:10px;font-size:13px;line-height:1.5;display:none;}
#imgInfo{margin-left:10px;color:#999;font-size:13px;}
</style>
</head>
<body>
<h2>🔍 Detectores de Tablas</h2>
<div class="panel">
<button onclick="document.getElementById('imageInput').click()">📷 Seleccionar Imagen</button>
<input type="file" id="imageInput" accept="image/*" style="display:none;">
<span id="imgInfo"></span>
</div>
<div class="panel">
<h3>🎨 Visualización (pellizca para zoom)</h3>
<div id="canvasContainer">
<canvas id="mainCanvas"></canvas>
<div class="canvas-controls">
<button onclick="canvasManager.zoomIn()">➕</button>
<button onclick="canvasManager.zoomOut()">➖</button>
<button onclick="canvasManager.reset()">🔄</button>
</div>
</div>
<div id="layerControls"></div>
</div>
<div class="panel">
<h3>⚙️ Algoritmos (6 disponibles)</h3>
<div class="checkbox-item"><div><input type="checkbox" id="algo_profile" value="Profile Projection" checked><span class="color-dot" style="background:#FFFF00;"></span><label for="algo_profile">Profile Projection</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('profile')">🔧</button></div>
<div class="checkbox-item"><div><input type="checkbox" id="algo_morph" value="Morphological" checked><span class="color-dot" style="background:#808080;"></span><label for="algo_morph">Morphological</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('morph')">🔧</button></div>
<div class="checkbox-item"><div><input type="checkbox" id="algo_radar" value="Cell Detector" checked><span class="color-dot" style="background:#800080;"></span><label for="algo_radar">Cell Detector</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('radar')">🔧</button></div>
<div class="checkbox-item"><div><input type="checkbox" id="algo_echo" value="Echo Radar" checked><span class="color-dot" style="background:#00BFFF;"></span><label for="algo_echo">Echo Radar</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('echo')">🔧</button></div>
<div class="checkbox-item"><div><input type="checkbox" id="algo_lattice" value="Lattice Radar" checked><span class="color-dot" style="background:#FF1493;"></span><label for="algo_lattice">Lattice Radar (complemento)</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('lattice')">🔧</button></div>
<div class="checkbox-item"><div><input type="checkbox" id="algo_fourier" value="Fourier Analysis" checked><span class="color-dot" style="background:#FFA500;"></span><label for="algo_fourier">Fourier Analysis</label></div><button class="btn-optimize" onclick="optimizeAlgorithm('fourier')">🔧</button></div>
<br>
<button onclick="selectAll()">✅ Todos</button>
<button onclick="deselectAll()">❌ Ninguno</button>
<button onclick="applySmartSelection()" class="btn-secondary">🧠 Selección Inteligente</button>
<br><br>
<button onclick="runAlgorithms()" id="runButton" disabled>🚀 Ejecutar</button>
<button onclick="optimizeSelected()" class="btn-secondary">🔧 Ajustar (anti-fantasmas)</button>
<button onclick="resetLearning()" class="btn-danger">🧹 Borrar aprendizaje</button>
<button onclick="cancelExecution()" id="cancelButton" class="btn-danger" style="display:none;">⏹️ Cancelar</button>
<div id="statusIndicator"></div>
<div id="analysisBox"></div>
<div id="diagnosisBox"></div>
</div>
<div class="panel">
<h3>📝 Log</h3>
<button class="btn-secondary" onclick="copyLog()">📋 Copiar Log</button>
<button class="btn-secondary" onclick="clearLog()">🗑️ Limpiar Log</button>
<div class="log-container" id="logContainer"></div>
</div>
<script src="js/utils/logger.js"></script>
<script src="js/utils/image-processor.js"></script>
<script src="js/utils/preprocessor.js"></script>
<script src="js/utils/line-validator.js"></script>
    <script src="js/utils/line-enhancer.js"></script>
<script src="js/utils/text-remover.js"></script>
<script src="js/visualization/canvas-manager.js"></script>
<script src="js/algorithms/profile-projection.js"></script>
<script src="js/algorithms/morphological.js"></script>
<script src="js/algorithms/radar-matcher.js"></script>
<script src="js/algorithms/echo-radar.js"></script>
<script src="js/algorithms/lattice-radar.js"></script>
<script src="js/algorithms/fourier.js"></script>
<script src="js/runner.js"></script>
<script src="js/diagnosis/adaptive-diagnosis.js"></script>
<script src="js/diagnosis/smart-analyzer.js"></script>
<script>
var DEFAULTS={minCoverage:0.50,minRunRatio:0.55,minSegRatio:0.60,gapTolerance:4};
function resetTuning(){try{lineValidator.minCoverage=DEFAULTS.minCoverage;lineValidator.minRunRatio=DEFAULTS.minRunRatio;lineValidator.minSegRatio=DEFAULTS.minSegRatio;lineValidator.gapTolerance=DEFAULTS.gapTolerance;}catch(e){}}
var LearningSystem={
  key:'tableDetector_v2',
  load(){try{return JSON.parse(localStorage.getItem(this.key)||'{}');}catch(e){return{};}},
  save(t,p,score,lines,aspect){
    if(score<0.85){logger.info('  Aprendizaje: descartado (score '+score.toFixed(3)+' < 0.85)');return;}
    try{var d=this.load();if(!d[t])d[t]=[];d[t].push({p:p,score:score,lines:lines,aspect:aspect,ts:Date.now()});
    if(d[t].length>10)d[t]=d[t].slice(-10);localStorage.setItem(this.key,JSON.stringify(d));
    logger.info('  Aprendizaje: guardado '+t+' (score '+score.toFixed(3)+')');}catch(e){}
  },
  best(t,aspect){
    var d=this.load();if(!d[t]||!d[t].length)return null;
    var q=d[t].filter(function(r){return r.score>=0.85&&Math.abs(r.aspect-aspect)<0.3;});
    if(!q.length){logger.info('  Aprendizaje: sin casos compatibles para '+t);return null;}
    var b=q.reduce(function(a,c){return a.score>c.score?a:c;});
    logger.info('  Aprendizaje: aplicando '+t+' (score '+b.score.toFixed(3)+', aspecto '+b.aspect.toFixed(2)+')');
    return b.p;
  },
  apply(t,aspect){
    var p=this.best(t,aspect);if(!p)return false;
    Object.keys(p).forEach(function(name){
      var a=Object.values(algorithmInstances).find(function(x){return x.name===name;});
      if(a)Object.keys(p[name]).forEach(function(k){if(a[k]!==undefined)a[k]=p[name][k];});
    });
    return true;
  }
};
function resetLearning(){localStorage.removeItem(LearningSystem.key);logger.info('Aprendizaje borrado');alert('Aprendizaje borrado');}
var canvasManager,runner,selector,smartAnalyzer,currentImageData=null;
var isRunning=false,cancelRequested=false,algorithmResults=[],algorithmInstances={},currentImageProfile=null;
function initApp(){
  logger.info('Iniciando aplicacion...');
  try{
    canvasManager=new CanvasManager('mainCanvas');
    runner=new AlgorithmRunner();
    selector=new AdaptiveDiagnosis();
    smartAnalyzer=new SmartAnalyzer();
    algorithmInstances={profile:new ProfileProjection(),morph:new Morphological(),radar:new RadarMatcher(),echo:new EchoRadar(),lattice:new LatticeRadar(),fourier:new FourierAnalysis()};
    Object.values(algorithmInstances).forEach(function(a){runner.registerAlgorithm(a);});
    document.getElementById('imageInput').addEventListener('change',handleImageLoad);
    resetTuning();
    logger.info('Aplicacion lista. 6 algoritmos registrados.');
  }catch(e){alert('ERROR al inicializar: '+e.message);logger.error('Error: '+e.message);}
}
function handleImageLoad(ev){
  var file=ev.target.files[0];if(!file)return;
  logger.info('Cargando: '+file.name);
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');c.width=img.width;c.height=img.height;
      var ctx=c.getContext('2d');ctx.drawImage(img,0,0);
      currentImageData=ctx.getImageData(0,0,c.width,c.height);
      resetTuning();
      try{lineValidator.invalidate();}catch(e){}
      if(typeof preprocessor!=='undefined'&&preprocessor.clearCache)preprocessor.clearCache();
      selector.history=[];algorithmResults=[];currentImageProfile=null;
      canvasManager.clearLayers();
      document.getElementById('layerControls').innerHTML='';
      document.getElementById('diagnosisBox').style.display='none';
      document.getElementById('analysisBox').style.display='none';
      setTimeout(function(){
        canvasManager.loadImage(currentImageData);
        document.getElementById('runButton').disabled=false;
        document.getElementById('imgInfo').textContent=img.width+'x'+img.height;
        logger.info('Imagen cargada: '+img.width+'x'+img.height);
      },80);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function applySmartSelection(){
  if(!currentImageData){alert('Primero carga una imagen');return;}
  logger.info('=== ANÁLISIS INTELIGENTE DE IMAGEN ===');
  resetTuning();
  currentImageProfile=smartAnalyzer.analyzeImage(currentImageData);
  lineValidator.currentImageType = currentImageProfile.imageType;
  var s=smartAnalyzer.getRecommendation();
  var aspect=currentImageData.width/currentImageData.height;
  LearningSystem.apply(currentImageProfile.imageType,aspect);
  document.querySelectorAll('.checkbox-item input[type="checkbox"]').forEach(function(cb){cb.checked=false;});
  var all=Object.values(algorithmInstances);
  s.primary.concat(s.secondary).forEach(function(name){
    var a=all.find(function(x){return x.name===name;});
    if(a){var k=Object.keys(algorithmInstances).find(function(key){return algorithmInstances[key]===a;});
      if(k)document.getElementById('algo_'+k).checked=true;}
  });
  Object.keys(s.params).forEach(function(name){
    var a=all.find(function(x){return x.name===name;});
    if(a)Object.keys(s.params[name]).forEach(function(p){
      if(a[p]!==undefined){a[p]=s.params[name][p];logger.info('  '+name+'.'+p+' = '+s.params[name][p]);}
    });
  });
  showAnalysis(currentImageProfile,s);
  logger.info('Selección inteligente aplicada');
}
function showAnalysis(p,s){
  var b=document.getElementById('analysisBox');
  var h='<strong style="color:#2196F3;">🧠 ANÁLISIS DE IMAGEN</strong><br>';
  h+='<strong>Tipo:</strong> '+p.imageType+'<br>';
  h+='<strong>Brillo:</strong> '+p.meanGray+(p.isDark?' (oscura)':' (clara)')+'<br>';
  h+='<strong>Densidad bordes:</strong> '+p.edgeDensity+'%<br>';
  h+='<strong>Líneas estimadas:</strong> '+p.hPeaks+'H / '+p.vPeaks+'V<br>';
  h+='<strong>Grosor:</strong> '+p.avgLineThickness+'px<br><br>';
  h+='<strong>🎯 Recomendados:</strong><br>'+s.primary.map(function(a){return '• '+a;}).join('<br>');
  b.innerHTML=h;b.style.display='block';
}
function optimizeAlgorithm(key){runTune([algorithmInstances[key].name]);}
function optimizeSelected(){
  var sel=Array.from(document.querySelectorAll('.checkbox-item input[type="checkbox"]:checked')).map(function(cb){return cb.value;});
  // Reordenar para que Echo Radar corra antes que Cell Detector
  if(sel.includes("Cell Detector") && sel.includes("Echo Radar")) {
    sel = sel.filter(function(n){ return n !== "Echo Radar"; });
    sel.unshift("Echo Radar");
    logger.info("⚙️ Reordenando ejecución: Echo Radar correrá antes que Cell Detector");
  }
  runTune(sel);
}
function runTune(names){
  if(!algorithmResults.length){alert('Primero ejecuta los algoritmos');return;}
  var adj=0;
  names.forEach(function(name){
    var r=algorithmResults.find(function(x){return x.algorithm===name;});
    if(!r)return;
    var a=Object.values(algorithmInstances).find(function(x){return x.name===name;});
    var g=r.metrics.ghosts||0,n=r.metrics.totalLines||0;
    if(g>Math.max(2,n*0.12)){
      lineValidator.minCoverage=Math.min(0.70,lineValidator.minCoverage+0.05);
      lineValidator.minRunRatio=Math.min(0.75,lineValidator.minRunRatio+0.05);
      lineValidator.gapTolerance=Math.max(2,lineValidator.gapTolerance-1);
      logger.info('  '+name+': '+g+' fantasmas -> endureciendo evidencia');adj++;
    }
    if(name==='Cell Detector'&&a){
      var cells=r.metrics.cellsDetected||0;
      if(cells===0){a.sideSupport=Math.max(0.12,(a.sideSupport||0.22)-0.05);a.minCellWidth=Math.max(10,a.minCellWidth-4);a.minCellHeight=Math.max(8,a.minCellHeight-3);logger.info('  Cell Detector: sin celdas -> relajando soporte de lados');adj++;}
    }
    if(name==='Fourier Analysis'&&a&&a.setMinDistance){
      if(n>150){a.setMinDistance((a.minDistance||10)+4);logger.info('  Fourier: subiendo minDistance');adj++;}
      else if(n<10){a.setMinDistance(Math.max(5,(a.minDistance||10)-2));logger.info('  Fourier: bajando minDistance');adj++;}
    }
  });
  if(adj){logger.info('Ajustes aplicados: '+adj+'. Ejecuta de nuevo.');alert(adj+' ajustes aplicados. Ejecuta de nuevo.');}
  else{logger.info('No se requirieron ajustes');alert('Sin ajustes necesarios');}
}
function selectAll(){document.querySelectorAll('.checkbox-item input[type="checkbox"]').forEach(function(cb){cb.checked=true;});logger.info('Todos seleccionados');}
function deselectAll(){document.querySelectorAll('.checkbox-item input[type="checkbox"]').forEach(function(cb){cb.checked=false;});logger.info('Todos deseleccionados');}
async function runAlgorithms(){
  if(!currentImageData||isRunning)return;
  var sel=Array.from(document.querySelectorAll('.checkbox-item input[type="checkbox"]:checked')).map(function(cb){return cb.value;});
  // Reordenar para que Echo Radar corra antes que Cell Detector
  if(sel.includes("Cell Detector") && sel.includes("Echo Radar")) {
    sel = sel.filter(function(n){ return n !== "Echo Radar"; });
    sel.unshift("Echo Radar");
    logger.info("⚙️ Reordenando ejecución: Echo Radar correrá antes que Cell Detector");
  }
  if(!sel.length){logger.error('No hay algoritmos seleccionados');return;}
  isRunning=true;cancelRequested=false;algorithmResults=[];
  canvasManager.clearLayers();
  document.getElementById('layerControls').innerHTML='';
  document.getElementById('diagnosisBox').style.display='none';
  document.getElementById('runButton').disabled=true;
  document.getElementById('cancelButton').style.display='inline-block';
  logger.info('Algoritmos a ejecutar: '+sel.join(', '));
  for(var i=0;i<sel.length;i++){
    if(cancelRequested){logger.info('Ejecucion cancelada');break;}
    var name=sel[i];
    showStatus('Procesando '+name+'... ('+(i+1)+'/'+sel.length+')');
    await new Promise(function(r){setTimeout(r,20);});
    try{
      var res=await runner.runAlgorithm(name,currentImageData);
      algorithmResults.push(res);
      drawLayer(res.algorithm,res.lines,res.color);
      logger.info(res.algorithm+': '+res.metrics.totalLines+' lineas en '+res.metrics.executionTime+'ms');
    }catch(e){logger.error('Error en '+name+': '+e.message);}
    await new Promise(function(r){setTimeout(r,0);});
  }
  hideStatus();
  if(algorithmResults.length&&!cancelRequested){
    try{
      var dg=selector.analyze(algorithmResults,currentImageData);
      showDiagnosis(dg);
      buildCombined(dg);
      updateLayerControls();
      var t=smartAnalyzer.imageProfile?smartAnalyzer.imageProfile.imageType:'DESCONOCIDO';
      var aspect=currentImageData.width/currentImageData.height;
      var params={};
      Object.values(algorithmInstances).forEach(function(a){
        params[a.name]={};
        ['minCoverage','minRunRatio','gapTolerance','minDistance','minCellWidth','minCellHeight','sideSupport','crossThreshold'].forEach(function(k){
          if(a[k]!==undefined)params[a.name][k]=a[k];
        });
      });
      if(dg.ranking&&dg.ranking.length)LearningSystem.save(t,params,dg.ranking[0].score,dg.ranking[0].metrics.totalLines,aspect);
    }catch(e){logger.error('Error en diagnostico: '+e.message);}
  }
  isRunning=false;
  document.getElementById('runButton').disabled=false;
  document.getElementById('cancelButton').style.display='none';
}
function drawLayer(name,lines,color){
  canvasManager.addLayer(name,function(ctx){
    ctx.strokeStyle=color;ctx.lineWidth=2;
    lines.forEach(function(l){ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();});
  });
}
function buildCombined(dg){
  if(!dg||!dg.bestLines||!dg.bestLines.length)return;
  var bestName=dg.ranking.filter(function(r){return r.algorithm!=="Lattice Radar";})[0];
  var lat=algorithmResults.find(function(r){return r.algorithm==="Lattice Radar";});
  if(!bestName||!lat)return;
  var merged=bestName.lines.map(function(l){return {x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,angle:l.angle};});
  var added=0;
  (lat.lines||[]).forEach(function(v){
    var x=(v.x1+v.x2)/2;
    var dup=merged.some(function(l){return Math.abs(l.x1-l.x2)<3&&Math.abs((l.x1+l.x2)/2-x)<6;});
    if(!dup){merged.push({x1:v.x1,y1:v.y1,x2:v.x2,y2:v.y2,angle:90});added++;}
  });
  if(added>0){
    var combinedResult={algorithm:"Combinado",color:"#00FF9C",lines:merged,metrics:{totalLines:merged.length,executionTime:0,ghosts:0}};
    algorithmResults.push(combinedResult);
    drawLayer(combinedResult.algorithm,merged,combinedResult.color);
    logger.info("Capa Combinada: "+merged.length+" lineas (+"+added+" verticales de Lattice)");
  }
}
function showDiagnosis(d){
  var b=document.getElementById('diagnosisBox');
  var h='<strong style="color:#FFD700;">🏆 '+d.best+'</strong><br>'+d.reasons.map(function(r){return '• '+r;}).join('<br>');
  if(d.ranking&&d.ranking.length>1){
    h+='<br><br><strong>Ranking (calidad visual):</strong><br>';
    h+=d.ranking.map(function(r,i){return (i+1)+'. '+r.algorithm+' — '+r.score.toFixed(3)+' ('+r.metrics.totalLines+' líneas, '+r.ghosts+' fantasmas)';}).join('<br>');
  }
  b.innerHTML=h;b.style.display='block';
  logger.info('Mejor algoritmo: '+d.best);
  d.reasons.forEach(function(r){logger.info('  '+r);});
}
function updateLayerControls(){
  var c=document.getElementById('layerControls');
  c.innerHTML='<strong>Capas (toca para mostrar/ocultar):</strong><br>';
  algorithmResults.forEach(function(r){
    var t=document.createElement('div');t.className='layer-toggle';
    var extra=r.metrics.cellsDetected!==undefined?(' | '+r.metrics.cellsDetected+' celdas'):'';
    t.innerHTML='<span class="color-dot" style="background:'+r.color+';"></span>'+r.algorithm+': '+r.metrics.totalLines+extra;
    var e=document.createElement('button');e.textContent='💾';
    e.style.cssText='margin-left:10px;padding:4px 8px;font-size:12px;background:#2196F3;';
    e.onclick=function(ev){ev.stopPropagation();canvasManager.exportLayer(r.algorithm);};
    t.appendChild(e);
    t.onclick=function(){canvasManager.toggleLayer(r.algorithm);t.classList.toggle('inactive');};
    c.appendChild(t);
  });
}
function cancelExecution(){cancelRequested=true;logger.info('Cancelacion solicitada...');}
function showStatus(t){var e=document.getElementById('statusIndicator');e.textContent=t;e.style.display='block';}
function hideStatus(){document.getElementById('statusIndicator').style.display='none';}
function copyLog(){navigator.clipboard.writeText(logger.getLogsText()).then(function(){alert('Log copiado');}).catch(function(e){logger.error('Error: '+e);});}
function clearLog(){logger.logs=[];logger.startTime=Date.now();updateLog();}
function updateLog(){var c=document.getElementById('logContainer');c.innerHTML=logger.getLogs().map(function(l){return '['+l.timestamp+'ms] ['+l.level+'] '+l.message;}).join('<br>');c.scrollTop=c.scrollHeight;}
setInterval(updateLog,500);
window.addEventListener('load',initApp);
</script>
</body>
</html>
