<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detectores de Tablas</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 15px; }
        .panel { background: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 6px; margin: 5px; }
        button:disabled { background: #555; }
        .btn-secondary { background: #2196F3; }
        #canvasContainer { width: 100%; height: 400px; background: #000; border: 2px solid #444; margin-bottom: 15px; }
        #mainCanvas { width: 100%; height: 100%; }
        .log-container { max-height: 300px; overflow-y: auto; background: #111; padding: 10px; font-family: monospace; font-size: 12px; }
        .checkbox-item { margin: 10px 0; }
        .checkbox-item input { margin-right: 10px; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <h2 style="text-align:center; color:#4CAF50;">Detectores de Tablas</h2>
    
    <div class="panel">
        <button onclick="document.getElementById('imageInput').click()">Seleccionar Imagen</button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
    </div>

    <div class="panel">
        <h3>Algoritmos</h3>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_hough" value="Hough Transform" checked>
            <span class="color-dot" style="background: #FF0000;"></span>
            <label for="algo_hough">Hough Transform</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_profile" value="Profile Projection" checked>
            <span class="color-dot" style="background: #FFFF00;"></span>
            <label for="algo_profile">Profile Projection</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="algo_morph" value="Morphological" checked>
            <span class="color-dot" style="background: #808080;"></span>
            <label for="algo_morph">Morphological</label>
        </div>
        <br>
        <button onclick="selectAll()">Seleccionar Todos</button>
        <button onclick="deselectAll()">Deseleccionar Todos</button>
        <br><br>
        <button onclick="runAlgorithms()" id="runButton" disabled>Ejecutar</button>
    </div>

    <div class="panel" id="vizPanel" style="display:none;">
        <div id="canvasContainer"><canvas id="mainCanvas"></canvas></div>
    </div>

    <div class="panel">
        <h3>Log</h3>
        <button class="btn-secondary" onclick="copyLog()">Copiar Log</button>
        <button class="btn-secondary" onclick="clearLog()">Limpiar Log</button>
        <div class="log-container" id="logContainer"></div>
    </div>

    <script src="js/utils/logger.js"></script>
    <script src="js/utils/image-processor.js"></script>
    <script src="js/visualization/canvas-manager.js"></script>
    <script src="js/algorithms/hough.js"></script>
    <script src="js/algorithms/profile-projection.js"></script>
    <script src="js/algorithms/morphological.js"></script>
    <script src="js/runner.js"></script>
    <script src="js/diagnosis/intelligent-selector.js"></script>
    
    <script>
        let canvasManager, runner, selector, currentImageData = null;

        function initApp() {
            logger.info("Iniciando aplicacion...");
            try {
                canvasManager = new CanvasManager('mainCanvas');
                runner = new AlgorithmRunner();
                selector = new IntelligentSelector();
                
                runner.registerAlgorithm(new HoughTransform());
                runner.registerAlgorithm(new ProfileProjection());
                runner.registerAlgorithm(new Morphological());
                
                document.getElementById('imageInput').addEventListener('change', handleImageLoad);
                logger.info("Aplicacion lista. 3 algoritmos registrados.");
            } catch (e) {
                alert("ERROR: " + e.message);
                logger.error(e.message);
            }
        }

        function selectAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
            logger.info("Todos los algoritmos seleccionados");
        }

        function deselectAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            logger.info("Todos los algoritmos deseleccionados");
        }

        function handleImageLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            logger.info("Cargando: " + file.name);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    canvasManager.loadImage(currentImageData);
                    document.getElementById('runButton').disabled = false;
                    document.getElementById('vizPanel').style.display = 'block';
                    logger.info("Imagen cargada: " + img.width + "x" + img.height);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function runAlgorithms() {
            if (!currentImageData) return;
            logger.info("Ejecutando algoritmos seleccionados...");
            
            const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            if (selected.length === 0) {
                logger.error("No hay algoritmos seleccionados");
                return;
            }
            
            logger.info("Algoritmos a ejecutar: " + selected.join(", "));
            const results = await runner.runSelected(selected, currentImageData);
            
            results.forEach(res => {
                canvasManager.addLayer(res.algorithm, (ctx) => {
                    ctx.strokeStyle = res.color;
                    ctx.lineWidth = 3;
                    res.lines.forEach(line => {
                        ctx.beginPath(); ctx.moveTo(line.x1, line.y1); ctx.lineTo(line.x2, line.y2); ctx.stroke();
                    });
                });
                logger.info(`${res.algorithm}: ${res.metrics.totalLines} lineas en ${res.metrics.executionTime}ms`);
            });
            
            const diagnosis = selector.analyze(results);
            logger.info("Mejor algoritmo: " + diagnosis.best);
        }

        function copyLog() {
            const text = logger.getLogsText();
            navigator.clipboard.writeText(text).then(() => {
                alert("Log copiado al portapapeles");
                logger.info("Log copiado al portapapeles");
            }).catch(err => {
                logger.error("Error al copiar: " + err);
            });
        }

        function clearLog() {
            logger.logs = [];
            logger.startTime = Date.now();
            updateLog();
            logger.info("Log limpiado");
        }

        function updateLog() {
            const container = document.getElementById('logContainer');
            container.innerHTML = logger.getLogs().map(l => `[${l.timestamp}ms] [${l.level}] ${l.message}`).join('<br>');
            container.scrollTop = container.scrollHeight;
        }
        setInterval(updateLog, 500);
        window.addEventListener("load", initApp);
    </script>
</body>
</html>
